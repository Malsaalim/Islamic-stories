<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f7f4ee; color: #1f2a24; font-family: Georgia, serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
  h1 { font-size: 1.4rem; color: #2f6b57; margin: 0 0 .75rem; }
  p { margin: 0 0 1.5rem; line-height: 1.6; }
  button { font: inherit; padding: .7rem 1.6rem; border-radius: 999px; border: 0; background: #2f6b57; color: #f7f4ee; }
</style>
</head>
<body>
  <main>
    <h1>Can't load the stories</h1>
    <p>Check your internet connection, then try again.</p>
    <button type="button" onclick="if (window.Android) Android.retry(); else location.reload();">Try again</button>
  </main>
</body>
</html>
