name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android licenses and install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: tawbah-stories-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TawbahStories.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TawbahStories.apk \
            --title "Tawbah Stories app (latest)" \
            --notes "Download TawbahStories.apk on your Android phone and open it to install." \
            --target "${{ github.sha }}"
